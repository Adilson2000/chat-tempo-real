

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat em Tempo Real</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e9edf2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px #ccc;
            overflow: hidden;
        }

        header {
            background: #1877f2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        #status {
            font-size: 13px;
            margin-top: 8px;
        }

        .user-area {
            padding: 15px;
            background: #f7f7f7;
        }

        #username {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px;
            border-radius: 12px;
            overflow-wrap: anywhere;
        }

        .mine {
            align-self: flex-end;
            background: #d1f5d3;
        }

        .others {
            align-self: flex-start;
            background: #e3eaf5;
        }

        .message strong {
            display: block;
            margin-bottom: 5px;
            color: #1877f2;
        }

        .date {
            display: block;
            font-size: 11px;
            color: #777;
            margin-top: 7px;
            text-align: right;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #1877f2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        @media (max-width: 500px) {
            body {
                padding: 5px;
            }

            .container {
                margin: 5px auto;
            }

            #messages {
                height: 65vh;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Chat em Tempo Real</h1>
        <p>Conecte-se e converse!</p>
        <div id="status">Conectando...</div>
    </header>

    <div class="user-area">
        <input type="text" id="username"
               placeholder="Digite seu nome" maxlength="30">
    </div>

    <div id="messages"></div>

    <div class="input-area">
        <input type="text" id="messageInput"
               placeholder="Digite sua mensagem..." maxlength="1000">

        <button id="sendButton" onclick="sendMessage()" disabled>
            Enviar
        </button>
    </div>

</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('messageInput');
    const usernameInput = document.getElementById('username');
    const statusDiv = document.getElementById('status');
    const sendButton = document.getElementById('sendButton');

    let myUserId = null;
    let socket;

    function connect() {
        socket = new WebSocket('ws://localhost:3000');

        socket.onopen = function() {
            statusDiv.textContent = 'Conectado';
            statusDiv.style.color = 'white';
            sendButton.disabled = false;
        };

        socket.onmessage = function(event) {
            const response = JSON.parse(event.data);

            if (response.type === 'welcome') {
                myUserId = response.userId;
            }

            if (response.type === 'history') {
                messagesDiv.innerHTML = '';
                response.messages.forEach(addMessage);
            }

            if (response.type === 'message') {
                addMessage(response.message);
            }
        };

        socket.onclose = function() {
            statusDiv.textContent = 'Desconectado';
            sendButton.disabled = true;
        };

        socket.onerror = function() {
            statusDiv.textContent = 'Erro na conexão';
        };
    }

    function addMessage(message) {
        const div = document.createElement('div');

        div.className = 'message';

        if (message.userId && message.userId === myUserId) {
            div.classList.add('mine');
        } else {
            div.classList.add('others');
        }

        const name = document.createElement('strong');
        name.textContent = message.username;

        const text = document.createElement('span');
        text.textContent = message.text;

        const date = document.createElement('span');
        date.className = 'date';
        date.textContent = new Date(message.date).toLocaleString('pt-BR');

        div.appendChild(name);
        div.appendChild(text);
        div.appendChild(date);

        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
        const username = usernameInput.value.trim();
        const text = input.value.trim();

        if (!username) {
            alert('Digite seu nome!');
            usernameInput.focus();
            return;
        }

        if (!text) return;

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
                username: username,
                text: text
            }));

            input.value = '';
        }
    }

    input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });

    connect();
</script>

</body>
</html>
